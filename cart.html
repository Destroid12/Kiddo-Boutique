  <section class="cart-page">
    <div class="wrap">
      <div class="page-header">
        <div class="breadcrumb">
          <a href="index.html">الرئيسية</a>
          <span>/</span>
          <span>السلة</span>
        </div>
        <h1>سلة المشتريات</h1>
      </div>

      <div id="cart-container" class="cart-layout">
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-sidebar" id="cart-summary">
          <h3 class="cart-sidebar-title">ملخص الطلب</h3>
          <div class="cart-sidebar-line">
            <span class="cart-sidebar-line-label">المجموع:</span>
            <span class="cart-sidebar-line-value" id="cart-total-price">0 ج.م</span>
          </div>
          <hr class="cart-sidebar-divider">
          <div class="cart-sidebar-total">
            <span>الإجمالي:</span>
            <span class="cart-sidebar-total-value" id="cart-final-price">0 ج.م</span>
          </div>
          <a href="checkout.html" id="checkout-btn" class="cart-sidebar-btn">متابعة الشراء</a>
        </div>
      </div>
    </div>
  </section>

    <div class="wrap">
      <span class="foot-left">© 2026 Kiddo Boutique</span>
    </div>
  </footer>

  <script src="cart.js"></script>
  <script>
    function renderCart() {
      Cart.init();
      var itemsContainer = document.getElementById('cart-items');
      var summary = document.getElementById('cart-summary');
      var checkoutBtn = document.getElementById('checkout-btn');
      var totalEl = document.getElementById('cart-total-price');
      var finalEl = document.getElementById('cart-final-price');

      itemsContainer.innerHTML = '';

      if (!Cart.items || Cart.items.length === 0) {
        if (summary) summary.style.display = 'none';
        if (checkoutBtn) {
          checkoutBtn.classList.add('disabled');
          checkoutBtn.setAttribute('aria-disabled', 'true');
          checkoutBtn.onclick = function(e) { e.preventDefault(); return false; };
        }
        itemsContainer.innerHTML =
          '<div class="cart-empty">' +
            '<p class="cart-empty-msg">سلتك فاضية خالص، لم تقم بإضافة أي منتجات بعد.</p>' +
            '<a href="shop.html" class="cart-empty-link">تصفح الكولكشن واشتري الآن</a>' +
          '</div>';
        return;
      }

      if (summary) summary.style.display = 'block';
      if (checkoutBtn) {
        checkoutBtn.classList.remove('disabled');
        checkoutBtn.removeAttribute('aria-disabled');
        checkoutBtn.onclick = null;
      }

      Cart.items.forEach(function(item) {
        var row = document.createElement('div');
        row.className = 'cart-item-row';
        row.innerHTML =
          '<img src="' + (item.image || '') + '" alt="' + (item.title || '') + '" class="cart-item-img">' +
          '<div class="cart-item-details">' +
            '<a href="product.html?id=' + item.id + '" class="cart-item-title">' + item.title + '</a>' +
            '<p class="cart-item-meta">تفاصيل: ' + (item.size || 'عادي') + '</p>' +
            '<p class="cart-item-price">' + item.price + ' ج.م</p>' +
          '</div>' +
          '<div class="cart-item-actions">' +
            '<input type="number" min="1" value="' + item.quantity + '" data-id="' + item.id + '" data-size="' + item.size + '" class="cart-qty-input">' +
            '<button class="cart-remove-btn" data-id="' + item.id + '" data-size="' + item.size + '">حذف</button>' +
          '</div>';
        itemsContainer.appendChild(row);
      });

      var total = Cart.getTotal();
      totalEl.textContent = total + ' ج.م';
      finalEl.textContent = total + ' ج.م';

      document.querySelectorAll('.cart-qty-input').forEach(function(input) {
        input.addEventListener('change', function(e) {
          Cart.updateQuantity(e.target.dataset.id, e.target.dataset.size, e.target.value);
          renderCart();
        });
      });

      document.querySelectorAll('.cart-remove-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          Cart.remove(e.target.dataset.id, e.target.dataset.size);
          renderCart();
        });
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      renderCart();
    });

    var burger = document.querySelector('.burger');
    var navRight = document.querySelector('.nav-right');
    var overlay = document.querySelector('.overlay');
    burger.addEventListener('click', function() {
      navRight.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', function() {
      navRight.classList.remove('open');
      overlay.classList.remove('show');
    });
  </script>
