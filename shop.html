<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="styles.css?v=2026.2">
  <style>
    .loading-container {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #eae6e1;
      border-top-color: #7E7AE0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-family: inherit;
      font-size: 1.05rem;
      color: #7a7a7a;
      font-weight: 600;
    }
    .skeleton-card {
      border-radius: 10px;
      overflow: hidden;
    }
    .skeleton-img {
      width: 100%;
      aspect-ratio: 3/4;
      border-radius: 10px;
      background: linear-gradient(90deg, #f0ede8 25%, #f8f6f2 50%, #f0ede8 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    .skeleton-text {
      height: 16px;
      margin-top: 12px;
      border-radius: 4px;
      background: linear-gradient(90deg, #f0ede8 25%, #f8f6f2 50%, #f0ede8 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      width: 70%;
    }
    .skeleton-price {
      height: 14px;
      margin-top: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg, #f0ede8 25%, #f8f6f2 50%, #f0ede8 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      width: 40%;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
</head>
<body>

        <div class="nav-socials">

  </nav>
  <div class="overlay"></div>

  <section class="shop-page">
    <div class="wrap">
      <div class="page-header">
        <div class="breadcrumb">
          <a href="index.html">الرئيسية</a>
          <span>/</span>
          <span id="breadcrumb-cat">الكولكشن</span>
        </div>
        <h1 id="category-title">كل المنتجات</h1>
      </div>

      <div class="shop-filters">
        <a href="shop.html" class="filter-btn active" data-cat="all">الكل</a>
        <a href="shop.html?category=boys" class="filter-btn" data-cat="boys">ولادي</a>
        <a href="shop.html?category=girls" class="filter-btn" data-cat="girls">بناتي</a>
        <a href="shop.html?category=babies" class="filter-btn" data-cat="babies">رضع</a>
      </div>
      <div class="shop-search" style="margin-bottom: 36px; text-align: center;">
        <input type="text" id="search-input" placeholder="ابحثي عن منتج..." style="padding: 12px 20px; width: 100%; max-width: 400px; border-radius: 24px; border: 1px solid #eae6e1; font-family: inherit; font-size: 0.95rem; outline: none;">
      </div>

      <div id="shop-loader" class="loading-container">
        <div class="spinner"></div>
        <p class="loading-text">جاري تحميل المنتجات...</p>
      </div>

      <div class="shop-grid" id="products-container" style="display: none;"></div>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <span class="foot-left">© 2026 Kiddo Boutique</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="api.js"></script>
  <script src="cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      var urlParams = new URLSearchParams(window.location.search);
      var category = urlParams.get('category');

      var titleEl = document.getElementById('category-title');
      var breadcrumbCat = document.getElementById('breadcrumb-cat');
      var container = document.getElementById('products-container');
      var filters = document.querySelectorAll('.filter-btn');

      function updateFilterUI(cat) {
        filters.forEach(function(btn) {
          btn.classList.remove('active');
          if (cat === btn.getAttribute('data-cat') || (!cat && btn.getAttribute('data-cat') === 'all')) {
            btn.classList.add('active');
            titleEl.textContent = btn.textContent;
            breadcrumbCat.textContent = btn.textContent;
          }
        });
      }

      updateFilterUI(category);

      filters.forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          var cat = btn.getAttribute('data-cat');
          category = (cat === 'all') ? null : cat;
          updateFilterUI(category);
          var newUrl = category ? ('shop.html?category=' + category) : 'shop.html';
          history.pushState(null, '', newUrl);
          renderProducts();
        });
      });

      var allProducts = await fetchProducts();
      var currentQuery = '';

      var loaderEl = document.getElementById('shop-loader');
      if (loaderEl) loaderEl.style.display = 'none';
      container.style.display = 'grid';

      function renderProducts() {
        var filtered = allProducts;
        if (category) {
          filtered = filtered.filter(function(p) { return p.category === category; });
        }
        if (currentQuery) {
          filtered = filtered.filter(function(p) { return p.title.toLowerCase().includes(currentQuery); });
        }

        container.innerHTML = '';

        if (filtered.length === 0) {
          container.innerHTML = '<p class="cart-empty-msg" style="grid-column: 1/-1;">لا توجد منتجات مطابقة للبحث.</p>';
          return;
        }

        filtered.forEach(function(p) {
          var card = document.createElement('a');
          card.href = 'product.html?id=' + p.id;
          card.className = 'product-card';

          var img = document.createElement('img');
          img.src = p.image;
          img.alt = p.title;
          img.className = 'product-card-img';

          var info = document.createElement('div');
          info.className = 'product-card-info';

          var title = document.createElement('h3');
          title.className = 'product-card-title';
          title.textContent = p.title;

          var price = document.createElement('p');
          price.className = 'product-card-price';
          var pricesList = String(p.price).split(',').map(function(s) { return s.trim(); });
          if(pricesList.length > 1) {
            price.textContent = 'يبدأ من ' + pricesList[0] + ' ج.م';
          } else {
            price.textContent = p.price + ' ج.م';
          }

          info.appendChild(title);
          info.appendChild(price);
          card.appendChild(img);
          card.appendChild(info);

          if (p.status === 'out_of_stock') {
            var badge = document.createElement('span');
            badge.textContent = 'نفذت الكمية';
            badge.style.position = 'absolute';
            badge.style.top = '10px';
            badge.style.right = '10px';
            badge.style.background = '#e74c3c';
            badge.style.color = 'white';
            badge.style.padding = '4px 10px';
            badge.style.borderRadius = '12px';
            badge.style.fontSize = '0.8rem';
            card.appendChild(badge);
            card.style.position = 'relative';
          }

          container.appendChild(card);
        });
      }

      document.getElementById('search-input').addEventListener('input', function(e) {
        currentQuery = e.target.value.toLowerCase().trim();
        renderProducts();
      });

      renderProducts();
    });

    var burger = document.querySelector('.burger');
    var navRight = document.querySelector('.nav-right');
    var overlay = document.querySelector('.overlay');
    burger.addEventListener('click', function() {
      navRight.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', function() {
      navRight.classList.remove('open');
      overlay.classList.remove('show');
    });
  </script>
</body>
