<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الكولكشن - Kiddo Boutique</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <div class="wrap">
      <a href="index.html" class="logo">Kiddo Boutique</a>
      <div class="nav-right">
        <a href="shop.html">الكولكشن</a>
        <a href="index.html#why">ليه احنا</a>
        <a href="https://www.facebook.com/share/19TZ1tcnnn/" target="_blank" rel="noopener">صفحتنا</a>
        <a href="cart.html" class="cart-link">السلة <span class="cart-count">0</span></a>
      </div>
      <button class="burger" aria-label="القائمة">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke="currentColor">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
    </div>
  </nav>
  <div class="overlay"></div>

  <section class="shop-page">
    <div class="wrap">
      <div class="page-header">
        <div class="breadcrumb">
          <a href="index.html">الرئيسية</a>
          <span>/</span>
          <span id="breadcrumb-cat">الكولكشن</span>
        </div>
        <h1 id="category-title">كل المنتجات</h1>
      </div>

      <div class="shop-filters">
        <a href="shop.html" class="filter-btn active" data-cat="all">الكل</a>
        <a href="shop.html?category=boys" class="filter-btn" data-cat="boys">ولادي</a>
        <a href="shop.html?category=girls" class="filter-btn" data-cat="girls">بناتي</a>
        <a href="shop.html?category=babies" class="filter-btn" data-cat="babies">رضع</a>
      </div>

      <div class="shop-grid" id="products-container"></div>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <span class="foot-left">© 2026 Kiddo Boutique</span>
    </div>
  </footer>

  <script src="api.js"></script>
  <script src="cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      var urlParams = new URLSearchParams(window.location.search);
      var category = urlParams.get('category');

      var titleEl = document.getElementById('category-title');
      var breadcrumbCat = document.getElementById('breadcrumb-cat');
      var container = document.getElementById('products-container');
      var filters = document.querySelectorAll('.filter-btn');

      filters.forEach(function(btn) {
        btn.classList.remove('active');
        if (category === btn.getAttribute('data-cat') || (!category && btn.getAttribute('data-cat') === 'all')) {
          btn.classList.add('active');
          titleEl.textContent = btn.textContent;
          breadcrumbCat.textContent = btn.textContent;
        }
      });

      var products = await fetchProducts();
      var filtered = products;

      if (category) {
        filtered = products.filter(function(p) { return p.category === category; });
      }

      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = '<p class="cart-empty-msg">لا توجد منتجات في هذا القسم حالياً.</p>';
        return;
      }

      filtered.forEach(function(p) {
        var card = document.createElement('a');
        card.href = 'product.html?id=' + p.id;
        card.className = 'product-card';

        var img = document.createElement('img');
        img.src = p.image;
        img.alt = p.title;
        img.className = 'product-card-img';

        var info = document.createElement('div');
        info.className = 'product-card-info';

        var title = document.createElement('h3');
        title.className = 'product-card-title';
        title.textContent = p.title;

        var price = document.createElement('p');
        price.className = 'product-card-price';
        price.textContent = p.price + ' ج.م';

        info.appendChild(title);
        info.appendChild(price);
        card.appendChild(img);
        card.appendChild(info);
        container.appendChild(card);
      });
    });

    var burger = document.querySelector('.burger');
    var navRight = document.querySelector('.nav-right');
    var overlay = document.querySelector('.overlay');
    burger.addEventListener('click', function() {
      navRight.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', function() {
      navRight.classList.remove('open');
      overlay.classList.remove('show');
    });
  </script>
</body>
</html>
