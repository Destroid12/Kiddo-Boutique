<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التسوق - Kiddo Boutique</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <div class="wrap">
      <a href="index.html" class="logo">Kiddo Boutique</a>
      <div class="nav-right">
        <a href="shop.html">الكولكشن</a>
        <a href="index.html#why">ليه احنا</a>
        <a href="https://www.facebook.com/share/19TZ1tcnnn/" target="_blank" rel="noopener">صفحتنا</a>
        <a href="cart.html" class="cart-link">
          السلة <span class="cart-count" style="display:none">0</span>
        </a>
      </div>
      <button class="burger" aria-label="القائمة">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke="currentColor">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
    </div>
  </nav>
  <div class="overlay"></div>

  <section class="shop-page">
    <div class="wrap">
      <div class="shop-header">
        <h1 id="category-title">كل المنتجات</h1>
        <div class="shop-filters">
          <a href="shop.html" class="filter-btn active" data-cat="all">الكل</a>
          <a href="shop.html?category=boys" class="filter-btn" data-cat="boys">ولادي</a>
          <a href="shop.html?category=girls" class="filter-btn" data-cat="girls">بناتي</a>
          <a href="shop.html?category=babies" class="filter-btn" data-cat="babies">رضيع</a>
        </div>
      </div>
      
      <div class="shop-grid grid" id="products-container">
        <div class="loading" style="text-align:center; width:100%; grid-column:1/-1; padding:40px;">جاري التحميل...</div>
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <span class="foot-left">© 2026 Kiddo Boutique</span>
    </div>
  </footer>

  <script src="api.js"></script>
  <script src="cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const category = urlParams.get('category');
      
      const titleEl = document.getElementById('category-title');
      const container = document.getElementById('products-container');
      const filters = document.querySelectorAll('.filter-btn');
      
      filters.forEach(btn => {
        btn.classList.remove('active');
        if (category === btn.getAttribute('data-cat') || (!category && btn.getAttribute('data-cat') === 'all')) {
          btn.classList.add('active');
          titleEl.textContent = btn.textContent;
        }
      });

      const products = await fetchProducts();
      let filtered = products;
      
      if (category) {
        filtered = products.filter(p => p.category === category);
      }
      
      container.innerHTML = '';
      
      if (filtered.length === 0) {
        container.innerHTML = '<p style="grid-column:1/-1; text-align:center;">لا توجد منتجات في هذا القسم حالياً.</p>';
        return;
      }

      filtered.forEach(p => {
        const item = document.createElement('a');
        item.href = `product.html?id=${p.id}`;
        item.className = 'grid-item reveal visible';
        item.innerHTML = `
          <img src="${p.image}" alt="${p.title}">
          <span class="price-tag">${p.price} ج.م</span>
          <span class="label" style="margin-top: 8px; display:block; text-align:right;">${p.title}</span>
        `;
        container.appendChild(item);
      });
    });
    
    const burger = document.querySelector('.burger');
    const navRight = document.querySelector('.nav-right');
    const overlay = document.querySelector('.overlay');
    burger.addEventListener('click', () => {
      navRight.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', () => {
      navRight.classList.remove('open');
      overlay.classList.remove('show');
    });
  </script>
</body>
</html>
