<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتج - Kiddo Boutique</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <div class="wrap">
      <a href="index.html" class="logo">Kiddo Boutique</a>
      <div class="nav-right">
        <a href="shop.html">الكولكشن</a>
        <a href="index.html#why">ليه احنا</a>
        <a href="https://www.facebook.com/share/19TZ1tcnnn/" target="_blank" rel="noopener">صفحتنا</a>
        <a href="cart.html" class="cart-link">السلة <span class="cart-count">0</span></a>
      </div>
      <button class="burger" aria-label="القائمة">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke="currentColor">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
    </div>
  </nav>
  <div class="overlay"></div>

  <section class="product-page">
    <div class="wrap">
      <div class="page-header">
        <div class="breadcrumb">
          <a href="index.html">الرئيسية</a>
          <span>/</span>
          <a href="shop.html">الكولكشن</a>
          <span>/</span>
          <span id="breadcrumb-name">المنتج</span>
        </div>
        <h1 id="p-title">جاري التحميل...</h1>
      </div>

      <div id="product-container" class="product-detail">
        <div>
          <img id="p-image" class="product-detail-img" src="" alt="">
        </div>
        <div class="product-detail-info">
          <p class="product-detail-price" id="p-price"></p>
          <p class="product-stock">متوفر في المخزون</p>
          <p class="product-detail-desc" id="p-desc"></p>
          <hr class="product-detail-divider">
          <label class="product-size-label" for="size">المقاس:</label>
          <select id="size" class="product-size-select"></select>
          <button id="add-to-cart" class="product-add-btn">أضف للسلة</button>
          <a href="cart.html" class="product-buy-link">اشتري دلوقتي</a>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <span class="foot-left">© 2026 Kiddo Boutique</span>
    </div>
  </footer>

  <script src="api.js"></script>
  <script src="cart.js"></script>
  <script>
    var currentProduct = null;

    document.addEventListener('DOMContentLoaded', async function() {
      var urlParams = new URLSearchParams(window.location.search);
      var id = urlParams.get('id');

      if (!id) {
        document.getElementById('p-title').textContent = 'المنتج غير موجود.';
        return;
      }

      currentProduct = await fetchProductById(id);

      if (!currentProduct) {
        document.getElementById('p-title').textContent = 'المنتج غير موجود.';
        return;
      }

      document.title = currentProduct.title + ' - Kiddo Boutique';
      document.getElementById('p-image').src = currentProduct.image;
      document.getElementById('p-image').alt = currentProduct.title;
      document.getElementById('p-title').textContent = currentProduct.title;
      document.getElementById('breadcrumb-name').textContent = currentProduct.title;
      document.getElementById('p-price').textContent = currentProduct.price + ' ج.م';
      document.getElementById('p-desc').textContent = currentProduct.description;

      var sizeSelect = document.getElementById('size');
      currentProduct.sizes.forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        sizeSelect.appendChild(opt);
      });

      document.getElementById('add-to-cart').addEventListener('click', function() {
        var selectedSize = sizeSelect.value;
        Cart.add(currentProduct, selectedSize);
      });
    });

    var burger = document.querySelector('.burger');
    var navRight = document.querySelector('.nav-right');
    var overlay = document.querySelector('.overlay');
    burger.addEventListener('click', function() {
      navRight.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', function() {
      navRight.classList.remove('open');
      overlay.classList.remove('show');
    });
  </script>
</body>
</html>
