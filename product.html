<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتج - Kiddo Boutique</title>
  <link rel="stylesheet" href="styles.css?v=1.2">
  <style>
    .loading-container {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #eae6e1;
      border-top-color: #7E7AE0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-family: inherit;
      font-size: 1.05rem;
      color: #7a7a7a;
      font-weight: 600;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
</head>
<body>
  <nav>
    <div class="wrap">
      <a href="index.html" class="logo">Kiddo Boutique</a>
      <div class="nav-right">
        <a href="shop.html">الكولكشن</a>
        <a href="index.html#why">ليه احنا</a>
        <div class="nav-socials">
          <a href="https://www.facebook.com/share/19TZ1tcnnn/" target="_blank" rel="noopener" class="nav-social-link" title="فيسبوك">
            <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </a>
          <a href="https://www.instagram.com/" target="_blank" rel="noopener" class="nav-social-link" title="إنستجرام">
            <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
          </a>
        </div>
        <a href="cart.html" class="cart-link">السلة <span class="cart-count">0</span></a>
      </div>
      <button class="burger" aria-label="القائمة">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke="currentColor">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
    </div>
  </nav>
  <div class="overlay"></div>

  <section class="product-page">
    <div class="wrap">
      <div class="page-header">
        <div class="breadcrumb">
          <a href="index.html">الرئيسية</a>
          <span>/</span>
          <a href="shop.html">الكولكشن</a>
          <span>/</span>
          <span id="breadcrumb-name">المنتج</span>
        </div>
        <h1 id="p-title">جاري التحميل...</h1>
      </div>

      <div id="product-loader" class="loading-container">
        <div class="spinner"></div>
        <p class="loading-text">جاري تحميل تفاصيل المنتج...</p>
      </div>

      <div id="product-container" class="product-detail" style="display:none;">
        <div>
          <img id="p-image" class="product-detail-img" src="" alt="">
          <div id="p-gallery" style="display:flex; gap:10px; margin-top:16px; overflow-x:auto;"></div>
        </div>
        <div class="product-detail-info">
          <p class="product-detail-price" id="p-price"></p>
          <p class="product-stock" id="p-stock">متوفر في المخزون</p>
          <p class="product-detail-desc" id="p-desc"></p>
          <hr class="product-detail-divider">
          <label class="product-size-label" for="size">تفاصيل:</label>
          <select id="size" class="product-size-select"></select>
          <button id="add-to-cart" class="product-add-btn">أضف للسلة</button>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <span class="foot-left">© 2026 Kiddo Boutique</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="api.js"></script>
  <script src="cart.js"></script>
  <script>
    var currentProduct = null;

    document.addEventListener('DOMContentLoaded', async function() {
      var urlParams = new URLSearchParams(window.location.search);
      var id = urlParams.get('id');

      if (!id) {
        document.getElementById('product-loader').style.display = 'none';
        document.getElementById('p-title').textContent = 'المنتج غير موجود.';
        return;
      }

      currentProduct = await fetchProductById(id);

      if (!currentProduct) {
        document.getElementById('product-loader').style.display = 'none';
        document.getElementById('p-title').textContent = 'المنتج غير موجود.';
        return;
      }

      document.getElementById('product-loader').style.display = 'none';
      document.getElementById('product-container').style.display = 'grid';

      document.title = currentProduct.title + ' - Kiddo Boutique';
      document.getElementById('p-image').src = currentProduct.image;
      document.getElementById('p-image').alt = currentProduct.title;
      document.getElementById('p-title').textContent = currentProduct.title;
      document.getElementById('breadcrumb-name').textContent = currentProduct.title;
      
      window.productPrices = String(currentProduct.price).split(',').map(function(p) { return p.trim(); });
      document.getElementById('p-price').textContent = window.productPrices[0] + ' ج.م';
      document.getElementById('p-desc').textContent = currentProduct.description || '';

      var stockEl = document.getElementById('p-stock');
      var addBtn = document.getElementById('add-to-cart');
      if (currentProduct.status === 'out_of_stock') {
        stockEl.textContent = 'نفذت الكمية';
        stockEl.style.color = '#e74c3c';
        stockEl.style.background = '#fdedec';
        stockEl.style.padding = '4px 10px';
        stockEl.style.borderRadius = '12px';
        stockEl.style.display = 'inline-block';
        
        addBtn.disabled = true;
        addBtn.textContent = 'غير متوفر حالياً';
        addBtn.style.opacity = '0.5';
        addBtn.style.cursor = 'not-allowed';
      }

      var gallery = document.getElementById('p-gallery');
      var images = currentProduct.images || [currentProduct.image];
      if (images.length > 1) {
        images.forEach(function(imgUrl) {
          var thumb = document.createElement('img');
          thumb.src = imgUrl;
          thumb.style.width = '70px';
          thumb.style.height = '90px';
          thumb.style.objectFit = 'cover';
          thumb.style.borderRadius = '8px';
          thumb.style.cursor = 'pointer';
          thumb.style.border = '2px solid transparent';
          if (imgUrl === currentProduct.image) thumb.style.borderColor = '#7E7AE0';
          
          thumb.addEventListener('click', function() {
            document.getElementById('p-image').src = imgUrl;
            Array.from(gallery.children).forEach(function(c) { c.style.borderColor = 'transparent'; });
            thumb.style.borderColor = '#7E7AE0';
          });
          gallery.appendChild(thumb);
        });
      }

      var sizeSelect = document.getElementById('size');
      var sizes = Array.isArray(currentProduct.sizes) && currentProduct.sizes.length > 0 ? currentProduct.sizes : ['عادي'];
      sizes.forEach(function(s, idx) {
        var opt = document.createElement('option');
        opt.value = s;
        opt.dataset.price = window.productPrices[idx] || window.productPrices[0];
        opt.textContent = s;
        sizeSelect.appendChild(opt);
      });

      sizeSelect.addEventListener('change', function() {
        var selectedOpt = sizeSelect.options[sizeSelect.selectedIndex];
        if (selectedOpt) {
          document.getElementById('p-price').textContent = selectedOpt.dataset.price + ' ج.م';
        }
      });

      document.getElementById('add-to-cart').addEventListener('click', function() {
        var selectedOpt = sizeSelect.options[sizeSelect.selectedIndex];
        var specificPrice = selectedOpt ? Number(selectedOpt.dataset.price) : Number(window.productPrices[0] || currentProduct.price);
        var chosenSize = selectedOpt ? selectedOpt.value : (sizes[0] || 'عادي');
        
        var productToCart = Object.assign({}, currentProduct);
        productToCart.price = specificPrice;
        
        Cart.add(productToCart, chosenSize);
      });
    });

    var burger = document.querySelector('.burger');
    var navRight = document.querySelector('.nav-right');
    var overlay = document.querySelector('.overlay');
    burger.addEventListener('click', function() {
      navRight.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', function() {
      navRight.classList.remove('open');
      overlay.classList.remove('show');
    });
  </script>
</body>
</html>
