<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الطلب - Kiddo Boutique</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>
<body>
  <nav>
    <div class="wrap">
      <a href="index.html" class="logo">Kiddo Boutique</a>
      <div class="nav-right">
        <a href="shop.html">الكولكشن</a>
        <a href="index.html#why">ليه احنا</a>
        <a href="https://www.facebook.com/share/19TZ1tcnnn/" target="_blank" rel="noopener">صفحتنا</a>
        <a href="cart.html" class="cart-link">السلة <span class="cart-count">0</span></a>
      </div>
      <button class="burger" aria-label="القائمة">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke="currentColor">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
    </div>
  </nav>
  <div class="overlay"></div>

  <section class="checkout-page">
    <div class="wrap">
      <div class="page-header">
        <div class="breadcrumb">
          <a href="index.html">الرئيسية</a>
          <span>/</span>
          <a href="cart.html">السلة</a>
          <span>/</span>
          <span>إتمام الطلب</span>
        </div>
        <h1>إتمام الطلب</h1>
      </div>

      <div class="checkout-layout" id="checkout-layout">
        <div class="checkout-form">
          <h3 class="checkout-form-title">بيانات الشحن</h3>
          <form id="checkoutForm">
            <div class="checkout-field">
              <label class="checkout-label">الاسم بالكامل</label>
              <input type="text" id="c-name" class="checkout-input" required>
            </div>
            <div class="checkout-field">
              <label class="checkout-label">رقم الهاتف</label>
              <input type="tel" id="c-phone" class="checkout-input" required>
            </div>
            <div class="checkout-field">
              <label class="checkout-label">حدد موقعك على الخريطة</label>
              <div id="map" style="height: 250px; border-radius: 8px; border: 1px solid #ddd; z-index: 1;"></div>
              <p style="font-size: 0.8rem; color: #666; margin-top: 5px;">اسحب العلامة الزرقاء لتحديد موقعك بدقة (إجباري لتوصيل الطلب)</p>
            </div>

            <div class="checkout-payment">
              <h3 class="checkout-payment-title">طريقة الدفع</h3>
              <label class="checkout-payment-option" style="margin-bottom: 12px; cursor: pointer;">
                <input type="radio" name="payment" value="cod" checked onchange="togglePaymentBox()"> 
                <span>💵 الدفع عند الاستلام</span>
              </label>
              
              <label class="checkout-payment-option" style="margin-bottom: 12px; cursor: pointer;">
                <input type="radio" name="payment" value="instapay" onchange="togglePaymentBox()"> 
                <span>⚡ إنستاباي (InstaPay)</span>
              </label>

              <!-- InstaPay Transfer Info Box -->
              <div id="instapay-box" style="display: none; background: #fdfaf6; border: 1.5px dashed #7E7AE0; border-radius: 10px; padding: 18px; margin-bottom: 16px;">
                <p style="font-size: 0.92rem; font-weight: 700; color: #2c2c2c; margin-bottom: 8px;">
                  📲 حوّل المبلغ الإجمالي لرقم إنستاباي التالي:
                </p>
                <div style="display: flex; align-items: center; justify-content: space-between; background: white; border: 1px solid #eae6e1; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px;">
                  <span id="instapay-account" style="font-weight: 700; color: #7E7AE0; direction: ltr; font-size: 1.1rem; letter-spacing: 1px;">01099667739</span>
                  <button type="button" id="copy-instapay-btn" onclick="copyInstaPay()" style="background: #7E7AE0; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-family: inherit; font-weight: 600;">نسخ الرقم</button>
                </div>
                <div class="checkout-field" style="margin-bottom: 0;">
                  <label class="checkout-label" style="font-size: 0.88rem;">اسم صاحب الحساب المحوّل منه أو رقم الهاتف للتأكيد:</label>
                  <input type="text" id="c-instapay-sender" class="checkout-input" placeholder="مثال: أحمد محمد أو رقم التليفون" style="font-size: 0.9rem; padding: 10px 14px;">
                </div>
              </div>

              <label class="checkout-payment-option" style="cursor: pointer;">
                <input type="radio" name="payment" value="paymob" onchange="togglePaymentBox()"> 
                <span>💳 الدفع بالبطاقة البنكية (Paymob)</span>
              </label>
            </div>

            <button type="submit" class="checkout-submit-btn" id="submit-btn">تأكيد الطلب</button>
          </form>
        </div>

        <div class="checkout-sidebar">
          <h3 class="checkout-sidebar-title">ملخص الطلب</h3>
          <div id="checkout-items"></div>
          <hr class="checkout-sidebar-divider">
          <div class="checkout-sidebar-line">
            <span class="checkout-sidebar-line-label">المجموع:</span>
            <span class="checkout-sidebar-line-value" id="co-total"></span>
          </div>
          <hr class="checkout-sidebar-divider">
          <div class="checkout-sidebar-total">
            <span>الإجمالي:</span>
            <span id="co-final"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <span class="foot-left">© 2026 Kiddo Boutique</span>
    </div>
  </footer>

  <script src="api.js"></script>
  <script src="cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        if (Cart.items.length === 0) {
          window.location.href = 'shop.html';
          return;
        }

        var itemsContainer = document.getElementById('checkout-items');
        Cart.items.forEach(function(item) {
          var row = document.createElement('div');
          row.className = 'checkout-sidebar-item';
          row.innerHTML =
            '<span class="checkout-sidebar-item-name">' + item.quantity + 'x ' + item.title + ' (' + item.size + ')</span>' +
            '<span class="checkout-sidebar-item-price">' + (item.price * item.quantity) + ' ج.م</span>';
          itemsContainer.appendChild(row);
        });

        var total = Cart.getTotal();
        document.getElementById('co-total').textContent = total + ' ج.م';
        document.getElementById('co-final').textContent = total + ' ج.م';
      }, 50);

      var form = document.getElementById('checkoutForm');
      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        var btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = 'جاري الإرسال...';

        var paymentMethod = document.querySelector('input[name="payment"]:checked').value;
        var paymentDetails = paymentMethod;
        if (paymentMethod === 'instapay') {
          var sender = document.getElementById('c-instapay-sender').value.trim();
          paymentDetails = sender ? ('instapay (' + sender + ')') : 'instapay';
        }

        if (!window.mapLocation) {
          alert('الرجاء تحديد موقعك على الخريطة أولاً!');
          btn.disabled = false;
          btn.textContent = 'تأكيد الطلب';
          return;
        }

        var fullAddress = 'https://www.google.com/maps/search/?api=1&query=' + window.mapLocation;

        var phoneVal = document.getElementById('c-phone').value.trim();
        if (phoneVal && !phoneVal.startsWith('0') && !phoneVal.startsWith('+')) {
          phoneVal = '0' + phoneVal;
        }

        var orderData = {
          name: document.getElementById('c-name').value.trim(),
          phone: phoneVal,
          address: fullAddress,
          payment: paymentDetails,
          items: Cart.items,
          total: Cart.getTotal()
        };

        var res = await submitOrder(orderData);

        if (res.success) {
          Cart.clear();
          if (res.paymentUrl) {
            window.location.href = res.paymentUrl;
          } else {
            document.getElementById('checkout-layout').innerHTML =
              '<div class="checkout-success">' +
                '<div class="checkout-success-icon">✓</div>' +
                '<h2 class="checkout-success-title">تم استلام طلبك بنجاح!</h2>' +
                (paymentMethod === 'instapay' 
                  ? '<p class="checkout-success-msg">تم تسجيل طلبك بالدفع عبر إنستاباي. هنتواصل معاك للتأكيد وموعد التوصيل.</p>'
                  : '<p class="checkout-success-msg">هنتواصل معاك قريب لتأكيد الطلب وموعد التوصيل.</p>') +
                '<a href="index.html" class="checkout-success-link">العودة للرئيسية</a>' +
              '</div>';
          }
        } else {
          alert('حدث خطأ: ' + (res.error || 'يرجى المحاولة مرة أخرى.'));
          btn.disabled = false;
          btn.textContent = 'تأكيد الطلب';
        }
      });
    });

    function togglePaymentBox() {
      var instapayChecked = document.querySelector('input[name="payment"][value="instapay"]').checked;
      var box = document.getElementById('instapay-box');
      if (box) {
        box.style.display = instapayChecked ? 'block' : 'none';
      }
    }

    function copyInstaPay() {
      var acc = document.getElementById('instapay-account').textContent.trim();
      navigator.clipboard.writeText(acc).then(function() {
        var btn = document.getElementById('copy-instapay-btn');
        var old = btn.textContent;
        btn.textContent = 'تم النسخ ✓';
        btn.style.background = '#27ae60';
        setTimeout(function() {
          btn.textContent = old;
          btn.style.background = '#7E7AE0';
        }, 2000);
      });
    }

    var map, marker;
    window.mapLocation = null;
    
    // Initialize map
    setTimeout(function() {
      map = L.map('map').setView([30.0444, 31.2357], 12); // Cairo
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      
      marker = L.marker([30.0444, 31.2357], {draggable: true}).addTo(map);
      
      marker.on('dragend', function() {
        var position = marker.getLatLng();
        window.mapLocation = position.lat + ',' + position.lng;
      });
      
      map.on('click', function(e) {
        marker.setLatLng(e.latlng);
        window.mapLocation = e.latlng.lat + ',' + e.latlng.lng;
      });
    }, 200);

    var burger = document.querySelector('.burger');
    var navRight = document.querySelector('.nav-right');
    var overlay = document.querySelector('.overlay');
    burger.addEventListener('click', function() {
      navRight.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', function() {
      navRight.classList.remove('open');
      overlay.classList.remove('show');
    });
  </script>
</body>
</html>
