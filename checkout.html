<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الطلب - Kiddo Boutique</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <div class="wrap">
      <a href="index.html" class="logo">Kiddo Boutique</a>
      <div class="nav-right">
        <a href="shop.html">الكولكشن</a>
        <a href="index.html#why">ليه احنا</a>
        <a href="https://www.facebook.com/share/19TZ1tcnnn/" target="_blank" rel="noopener">صفحتنا</a>
        <a href="cart.html" class="cart-link">السلة <span class="cart-count">0</span></a>
      </div>
      <button class="burger" aria-label="القائمة">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke="currentColor">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
    </div>
  </nav>
  <div class="overlay"></div>

  <section class="checkout-page">
    <div class="wrap">
      <div class="page-header">
        <div class="breadcrumb">
          <a href="index.html">الرئيسية</a>
          <span>/</span>
          <a href="cart.html">السلة</a>
          <span>/</span>
          <span>إتمام الطلب</span>
        </div>
        <h1>إتمام الطلب</h1>
      </div>

      <div class="checkout-layout" id="checkout-layout">
        <div class="checkout-form">
          <h3 class="checkout-form-title">بيانات الشحن</h3>
          <form id="checkoutForm">
            <div class="checkout-field">
              <label class="checkout-label">الاسم بالكامل</label>
              <input type="text" id="c-name" class="checkout-input" required>
            </div>
            <div class="checkout-field">
              <label class="checkout-label">رقم الهاتف</label>
              <input type="tel" id="c-phone" class="checkout-input" required>
            </div>
            <div class="checkout-field">
              <label class="checkout-label">العنوان بالتفصيل</label>
              <textarea id="c-address" class="checkout-textarea" rows="3" required></textarea>
            </div>

            <div class="checkout-payment">
              <h3 class="checkout-payment-title">طريقة الدفع</h3>
              <label class="checkout-payment-option">
                <input type="radio" checked> الدفع عند الاستلام
              </label>
            </div>

            <button type="submit" class="checkout-submit-btn" id="submit-btn">تأكيد الطلب</button>
          </form>
        </div>

        <div class="checkout-sidebar">
          <h3 class="checkout-sidebar-title">ملخص الطلب</h3>
          <div id="checkout-items"></div>
          <hr class="checkout-sidebar-divider">
          <div class="checkout-sidebar-line">
            <span class="checkout-sidebar-line-label">المجموع:</span>
            <span class="checkout-sidebar-line-value" id="co-total"></span>
          </div>
          <div class="checkout-sidebar-line">
            <span class="checkout-sidebar-line-label">الشحن:</span>
            <span class="checkout-sidebar-line-value">50 ج.م</span>
          </div>
          <hr class="checkout-sidebar-divider">
          <div class="checkout-sidebar-total">
            <span>الإجمالي:</span>
            <span id="co-final"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <span class="foot-left">© 2026 Kiddo Boutique</span>
    </div>
  </footer>

  <script src="api.js"></script>
  <script src="cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        if (Cart.items.length === 0) {
          window.location.href = 'shop.html';
          return;
        }

        var itemsContainer = document.getElementById('checkout-items');
        Cart.items.forEach(function(item) {
          var row = document.createElement('div');
          row.className = 'checkout-sidebar-item';
          row.innerHTML =
            '<span class="checkout-sidebar-item-name">' + item.quantity + 'x ' + item.title + ' (' + item.size + ')</span>' +
            '<span class="checkout-sidebar-item-price">' + (item.price * item.quantity) + ' ج.م</span>';
          itemsContainer.appendChild(row);
        });

        var total = Cart.getTotal();
        document.getElementById('co-total').textContent = total + ' ج.م';
        document.getElementById('co-final').textContent = (total + 50) + ' ج.م';
      }, 50);

      var form = document.getElementById('checkoutForm');
      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        var btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = 'جاري الإرسال...';

        var orderData = {
          name: document.getElementById('c-name').value,
          phone: document.getElementById('c-phone').value,
          address: document.getElementById('c-address').value,
          items: Cart.items,
          total: Cart.getTotal() + 50
        };

        var res = await submitOrder(orderData);

        if (res.success) {
          Cart.clear();
          document.getElementById('checkout-layout').innerHTML =
            '<div class="checkout-success">' +
              '<div class="checkout-success-icon">✓</div>' +
              '<h2 class="checkout-success-title">تم استلام طلبك بنجاح!</h2>' +
              '<p class="checkout-success-msg">هنتواصل معاك قريب لتأكيد الطلب وموعد التوصيل.</p>' +
              '<a href="index.html" class="checkout-success-link">العودة للرئيسية</a>' +
            '</div>';
        } else {
          alert('حدث خطأ، يرجى المحاولة مرة أخرى.');
          btn.disabled = false;
          btn.textContent = 'تأكيد الطلب';
        }
      });
    });

    var burger = document.querySelector('.burger');
    var navRight = document.querySelector('.nav-right');
    var overlay = document.querySelector('.overlay');
    burger.addEventListener('click', function() {
      navRight.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', function() {
      navRight.classList.remove('open');
      overlay.classList.remove('show');
    });
  </script>
</body>
</html>
