<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الطلب - Kiddo Boutique</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <div class="wrap">
      <a href="index.html" class="logo">Kiddo Boutique</a>
      <div class="nav-right">
        <a href="shop.html">الكولكشن</a>
        <a href="index.html#why">ليه احنا</a>
        <a href="https://www.facebook.com/share/19TZ1tcnnn/" target="_blank" rel="noopener">صفحتنا</a>
        <a href="cart.html" class="cart-link" style="color: #2c2c2c; font-weight:bold;">
          السلة <span class="cart-count" style="display:none">0</span>
        </a>
      </div>
      <button class="burger" aria-label="القائمة">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke="currentColor">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
    </div>
  </nav>
  <div class="overlay"></div>

  <section class="checkout-page" style="padding: 60px 0; min-height: 60vh;">
    <div class="wrap">
      <h1 style="margin-bottom: 30px; font-family:'Noto Kufi Arabic', sans-serif;">إتمام الطلب</h1>
      
      <div class="checkout-layout">
        
        <div class="checkout-form">
          <h3 style="margin-bottom: 20px; font-family:'Noto Kufi Arabic', sans-serif;">بيانات الشحن</h3>
          <form id="checkoutForm">
            <div class="form-group" style="margin-bottom: 16px;">
              <label style="display:block; margin-bottom:8px; font-size:0.95rem;">الاسم بالكامل</label>
              <input type="text" id="c-name" required style="width:100%; padding:12px; border-radius:6px; border:1px solid #ccc; font-family:inherit;">
            </div>
            <div class="form-group" style="margin-bottom: 16px;">
              <label style="display:block; margin-bottom:8px; font-size:0.95rem;">رقم الهاتف</label>
              <input type="tel" id="c-phone" required style="width:100%; padding:12px; border-radius:6px; border:1px solid #ccc; font-family:inherit;">
            </div>
            <div class="form-group" style="margin-bottom: 16px;">
              <label style="display:block; margin-bottom:8px; font-size:0.95rem;">العنوان بالتفصيل</label>
              <textarea id="c-address" rows="3" required style="width:100%; padding:12px; border-radius:6px; border:1px solid #ccc; font-family:inherit; resize:vertical;"></textarea>
            </div>
            
            <h3 style="margin-top: 30px; margin-bottom: 16px; font-family:'Noto Kufi Arabic', sans-serif;">طريقة الدفع</h3>
            <div class="form-group" style="padding: 16px; border: 1px solid #7E7AE0; border-radius: 8px; background: #f0eef8;">
              <label style="margin:0; font-weight:bold; display:flex; align-items:center;">
                <input type="radio" checked style="margin-left:8px; width:18px; height:18px;"> الدفع عند الاستلام (Cash on Delivery)
              </label>
            </div>
            
            <button type="submit" class="cta" id="submit-btn" style="width:100%; margin-top:24px; padding:16px; border:none; cursor:pointer; font-size:1.1rem; border-radius:8px;">تأكيد الطلب وإرسال</button>
          </form>
        </div>
        
        <div class="checkout-summary" style="background:#faf8f5; padding:24px; border-radius:12px; border:1px solid #eae6e1; height:fit-content;">
          <h3 style="margin-bottom: 20px; font-family:'Noto Kufi Arabic', sans-serif;">ملخص الطلب</h3>
          <div id="checkout-items" style="margin-bottom: 20px;"></div>
          
          <hr style="margin: 20px 0; border:0; border-top:1px solid #eae6e1;">
          <div class="summary-line" style="display:flex; justify-content:space-between; margin-bottom:12px;">
            <span style="color:#7a7a7a;">المجموع:</span>
            <span id="co-total" style="font-weight:bold;"></span>
          </div>
          <div class="summary-line" style="display:flex; justify-content:space-between; margin-bottom:12px;">
            <span style="color:#7a7a7a;">مصاريف الشحن:</span>
            <span style="font-weight:bold;">50 ج.م</span>
          </div>
          <div class="summary-line" style="display:flex; justify-content:space-between; font-size:1.2rem; font-weight:bold; color:#7E7AE0; margin-top:16px;">
            <span>الإجمالي المطلوب:</span>
            <span id="co-final"></span>
          </div>
        </div>
        
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <span class="foot-left">© 2026 Kiddo Boutique</span>
    </div>
  </footer>

  <script src="api.js"></script>
  <script src="cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (Cart.items.length === 0) {
          window.location.href = 'shop.html';
          return;
        }

        const itemsContainer = document.getElementById('checkout-items');
        Cart.items.forEach(item => {
          const row = document.createElement('div');
          row.style.display = 'flex';
          row.style.justifyContent = 'space-between';
          row.style.marginBottom = '12px';
          row.style.fontSize = '0.9rem';
          row.innerHTML = `
            <span>${item.quantity}x ${item.title} (${item.size})</span>
            <span style="font-weight:bold;">${item.price * item.quantity} ج.م</span>
          `;
          itemsContainer.appendChild(row);
        });

        const total = Cart.getTotal();
        document.getElementById('co-total').textContent = total + ' ج.م';
        document.getElementById('co-final').textContent = (total + 50) + ' ج.م';
      }, 50);

      const form = document.getElementById('checkoutForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.textContent = 'جاري الإرسال...';
        btn.style.opacity = '0.7';

        const orderData = {
          name: document.getElementById('c-name').value,
          phone: document.getElementById('c-phone').value,
          address: document.getElementById('c-address').value,
          items: Cart.items,
          total: Cart.getTotal() + 50
        };

        const res = await submitOrder(orderData);
        
        if (res.success) {
          Cart.clear();
          document.querySelector('.checkout-layout').innerHTML = `
            <div style="text-align:center; padding: 60px 20px; background: #f0eef8; border-radius: 12px; grid-column:1/-1;">
              <h2 style="color: #7E7AE0; margin-bottom:16px;">تم استلام طلبك بنجاح! 🎉</h2>
              <p style="margin-bottom: 24px; color:#555;">سنتواصل معك قريباً لتأكيد الطلب وموعد التوصيل.</p>
              <a href="index.html" class="cta">العودة للرئيسية</a>
            </div>
          `;
        } else {
          alert('حدث خطأ، يرجى المحاولة مرة أخرى.');
          btn.disabled = false;
          btn.textContent = 'تأكيد الطلب وإرسال';
          btn.style.opacity = '1';
        }
      });
    });

    // Burger menu
    const burger = document.querySelector('.burger');
    const navRight = document.querySelector('.nav-right');
    const overlay = document.querySelector('.overlay');
    burger.addEventListener('click', () => {
      navRight.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', () => {
      navRight.classList.remove('open');
      overlay.classList.remove('show');
    });
  </script>
</body>
</html>
